<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">Ritesh Roshan</title>
<desc id="d">Builder. Curious. Usually mid-experiment. I take things apart to see how they work, then build better ones. A soft white robot rises into frame, blinks, tilts his head with curiosity, and says hello.</desc>
<defs>
  <radialGradient id="vinyl" cx=".34" cy=".22" r=".95"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#EEF1F5"/><stop offset="1" stop-color="#AEB8C3"/></radialGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1000" height="420"/></clipPath>
  <clipPath id="torso"><path d="M520 470C540 336 650 268 790 264C930 268 1040 336 1060 470Z"/></clipPath>
  <clipPath id="skull"><path d="M655 220C650 150 710 108 790 108C870 108 930 150 925 220C922 262 880 284 790 284C700 284 658 262 655 220Z"/></clipPath>
  <filter id="lift" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#FFFFFF" flood-opacity=".08"/></filter>
  <filter id="b6" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="b14" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<style>
@font-face{font-family:S;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2')}
.serif{font-family:S,Georgia,serif;fill:#F0F6FC}
.name{font-size:80px;letter-spacing:-1px}
.hello{font-size:40px}
.sans{font-family:G,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.label{font-size:16px;fill:#9198A1}
.sub{font-size:21px;fill:#9198A1}
.vinyl{fill:url(#vinyl)}
.eye{fill:#16191D}
.rise{animation:rise-up 1.4s .3s cubic-bezier(.2,.9,.25,1.08) both}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.5s 1.8s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 9s 2.6s cubic-bezier(.45,0,.25,1) infinite backwards}
.face{transform-box:fill-box;transform-origin:center;animation:blink 5s 1.5s infinite backwards}
.say{animation:fade-in .8s 2s ease-out both}
.in{animation:fade-up .7s cubic-bezier(.2,.8,.2,1) both}

@keyframes rise-up{from{transform:translateY(300px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.012)}}
@keyframes tilt{0%,30%,100%{transform:rotate(0)}7%,22%{transform:rotate(-9deg)}}
@keyframes blink{0%,6%,100%{transform:scaleY(1)}3%{transform:scaleY(.08)}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<ellipse cx="790" cy="300" rx="260" ry="200" fill="url(#halo)"/>

<g clip-path="url(#frame)"><g class="rise" filter="url(#lift)">
  <g class="breath">
    <path class="vinyl" d="M520 470C540 336 650 268 790 264C930 268 1040 336 1060 470Z"/>
    <g clip-path="url(#torso)">
      <ellipse cx="790" cy="282" rx="132" ry="20" fill="#0B0D10" opacity=".22" filter="url(#b6)"/>
      <ellipse cx="672" cy="340" rx="80" ry="26" fill="#fff" opacity=".85" filter="url(#b14)"/>
      <ellipse cx="1000" cy="420" rx="120" ry="120" fill="#0B0D10" opacity=".10" filter="url(#b14)"/>
    </g>
    <circle cx="876" cy="356" r="15" fill="none" stroke="#0B0D10" stroke-opacity=".10" stroke-width="2"/>
    <circle cx="876" cy="356" r="9" fill="#0B0D10" fill-opacity=".05"/>
  </g>
  <g class="head">
    <path class="vinyl" d="M655 220C650 150 710 108 790 108C870 108 930 150 925 220C922 262 880 284 790 284C700 284 658 262 655 220Z"/>
    <g clip-path="url(#skull)">
      <ellipse cx="742" cy="140" rx="64" ry="20" fill="#fff" opacity=".95" filter="url(#b6)"/>
      <ellipse cx="900" cy="250" rx="70" ry="46" fill="#0B0D10" opacity=".08" filter="url(#b14)"/>
    </g>
    <g class="face">
      <rect class="eye" x="744" y="198.2" width="92" height="3.6" rx="1.8"/>
      <circle class="eye" cx="744" cy="200" r="12.5"/>
      <circle class="eye" cx="836" cy="200" r="12.5"/>
    </g>
  </g>
</g></g>

<text class="serif hello say" x="626" y="214" text-anchor="end">Hello.</text>

<text class="sans label in" x="48" y="112">Builder. Curious. Usually mid-experiment.</text>
<text class="serif name in" x="44" y="194" style="animation-delay:.15s">Ritesh Roshan</text>
<text class="sans sub in" x="48" y="248" style="animation-delay:.3s">I take things apart to see how they work,</text>
<text class="sans sub in" x="48" y="276" style="animation-delay:.3s">then build better ones.</text>
</svg>
